### Telemt WEB Config.toml
# WEB-only configuration: every listener serves the WEB bridge and
# relays traffic directly to Telegram DCs through [upstreams].

# === General Settings ===
[general]

# === Logging ===
# Log level: debug | verbose | normal | silent
# Can be overridden with --silent or --log-level CLI flags
# RUST_LOG env var takes absolute priority over all of these
[logging]
log_level = "normal"
show_users_links = true
# show_users_links = false # Don't emit WEB proxy links at startup

# === Listener Binding ===
# Single WEB listener; the unix socket variant is also supported via
# socket_path (see docs/Config_params/CONFIG_PARAMS.en.md).

# === Metrics Endpoint ===
# [metrics]
# port = 9090
# listen = "127.0.0.1:9090" # Listen address for metrics (overrides port)
# whitelist = ["127.0.0.1/32", "::1/128"]

[api]
enabled = true
listen = "127.0.0.1:9091"
whitelist = ["127.0.0.1/32", "::1/128"]
minimal_runtime_enabled = false
minimal_runtime_cache_ttl_ms = 1000
# Empty by default, which leaves the API open to the whitelist CIDRs.
# Set an exact "Bearer <random>" value to require authentication.
# auth_header = "Bearer <random>"

# WEB listener behind a local L7 reverse proxy; /0 networks are rejected.
[listener]
ip = "127.0.0.1"
port = 443
web_trusted_proxy_cidrs = ["127.0.0.1/32", "::1/128"]

# === WEB Bridge ===
[web]
# Single secret representation for every profile; explicit
# [[web.vhost.profiles]] entries require it.
secret_mode = "plain"
# Fixed carrier for every session: "https", "https-lanes",
# "websocket", or "websocket-lanes" (default "https").
carrier = "https"

[web.vhost]
host = "proxy.example.com"
# Exact case-sensitive route prefix without slashes; empty keeps the
# root v1 capability. A non-empty path uses the v2 host/path capability.
base_path = "telegram/web"
public_addr = "203.0.113.1:443"
# Ordinary-site fallback for unauthenticated or invalid traffic: an
# http:// origin without credentials, path, query, or fragment whose
# host is a loopback, link-local, or private IP literal (default
# resolve = "never"), or unix:/absolute/path.sock to connect a local
# unix socket (no DNS; the vhost host is sent as the request authority).
upstream = "http://127.0.0.1:80"
# Optional hostname fallback: "never" (default, IP literals only) or
# "startup" (resolve once at config preparation; answers must stay
# inside loopback or a private network). Rejected for unix: origins.
# resolve = "never"

[[web.vhost.profiles]]
user = "hello"

[users]
# format: "username" = "32_hex_chars_secret"
hello = "00000000000000000000000000000000"

# === Upstream ===
[[upstreams]]
type = "direct"
enabled = true
weight = 10
