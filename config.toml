### Telemt WEB Config.toml
# WEB-only configuration: every listener serves the WEB bridge and
# relays traffic directly to Telegram DCs through [upstreams].

# === General Settings ===
[general]

# === Logging ===
# Log level: debug | verbose | normal | silent
# Can be overridden with --silent or --log-level CLI flags
# RUST_LOG env var takes absolute priority over all of these
[logging]
log_level = "normal"
show_users_links = true
# show_users_links = false # Don't emit WEB proxy links at startup

# === Listener Binding ===
# Single WEB listener; the unix socket variant is also supported via
# socket_path (see docs/Config_params/CONFIG_PARAMS.en.md).

# === Metrics Endpoint ===
# [metrics]
# port = 9090
# listen = "127.0.0.1:9090" # Listen address for metrics (overrides port)
# whitelist = ["127.0.0.1/32", "::1/128"]

[api]
enabled = true
listen = "127.0.0.1:9091"
whitelist = ["127.0.0.1/32", "::1/128"]
minimal_runtime_enabled = false
minimal_runtime_cache_ttl_ms = 1000

# WEB listener behind a local L7 reverse proxy; /0 networks are rejected.
[listener]
ip = "127.0.0.1"
port = 443
transport = "web"
web_trusted_proxy_cidrs = ["127.0.0.1/32", "::1/128"]

# === WEB Bridge ===
[web]
enabled = true

[[web.vhosts]]
host = "proxy.example.com"
public_addr = "203.0.113.1:443"

[web.vhosts.fallback]
# Ordinary-site fallback for unauthenticated or invalid traffic.
# The only mode is http_upstream.
mode = "http_upstream"
# http_upstream: required. An http:// origin without credentials, path, query,
# or fragment whose host is a loopback, link-local, or private IP literal, or
# unix:/absolute/path.sock to connect a local unix socket (no DNS; the vhost
# host is sent as the request authority).
upstream = "http://127.0.0.1:80"
# http_upstream: optional. "never" = IP literals only, no DNS (default);
# "startup" = resolve a hostname once during config preparation; every answer
# must stay inside loopback or a private network and the answers are pinned
# for the generation. Rejected for unix: origins.
# resolve = "never"

[[web.vhosts.profiles]]
user = "hello"
secret_mode = "plain"

[access.users]
# format: "username" = "32_hex_chars_secret"
hello = "00000000000000000000000000000000"

# === Upstream ===
[[upstreams]]
type = "direct"
enabled = true
weight = 10
